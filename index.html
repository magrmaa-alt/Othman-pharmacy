<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صيدلية عثمان</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0e3a6e;--blue:#1c6fc4;--sky:#e6f1fc;--bg:#f3f8fe;--card:#fff;--text:#12335c;--muted:#5a7699;--line:#d6e5f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1a30;--card:#12294a;--text:#e6f0fc;--muted:#9bb6d6;--line:#22406b;--sky:#173459;--navy:#2f7fd6}}
:root[data-theme="dark"]{--bg:#0a1a30;--card:#12294a;--text:#e6f0fc;--muted:#9bb6d6;--line:#22406b;--sky:#173459;--navy:#2f7fd6}
*{box-sizing:border-box;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Cairo',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center}
main{width:100%;max-width:480px;padding:28px 18px 0;text-align:center;background:linear-gradient(180deg,var(--sky) 0,var(--bg) 320px)}
.logo{width:132px;height:132px;margin:0 auto 10px;border-radius:50%;box-shadow:0 4px 18px rgba(14,58,110,.25)}.logo img{width:100%;height:100%;display:block;border-radius:50%}
h1{font-size:2.1rem;font-weight:800;color:var(--navy);line-height:1.3}
.doc{color:var(--muted);font-weight:600;margin-top:2px}
.tel{display:inline-flex;align-items:center;gap:8px;margin-top:12px;padding:8px 20px;border-radius:30px;background:var(--sky);color:var(--navy);font-weight:700;font-size:1.15rem;text-decoration:none;direction:ltr}
.pay{margin-top:20px;width:100%;border:0;border-radius:40px;background:var(--navy);color:#fff;font:700 1.2rem 'Cairo',sans-serif;padding:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:10px}
.pay svg{transition:transform .2s}.pay[aria-expanded=true] svg{transform:rotate(180deg)}
.opts{display:none;gap:10px;margin-top:10px}.opts.open{display:grid}
.opts a{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;color:var(--text);font-weight:700;text-decoration:none}
h2{font-size:1.2rem;color:var(--navy);margin:28px 0 12px;display:flex;align-items:center;gap:10px}
h2:before,h2:after{content:"";flex:1;height:1px;background:var(--line)}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grid a{color:var(--text);text-decoration:none;font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0;border-radius:12px}
.grid a:hover,.opts a:hover{background:var(--sky)}
.ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;background:var(--sky)}
.svc{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.svc div{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 8px;font-weight:700;font-size:.95rem;display:flex;flex-direction:column;align-items:center;gap:8px}
.svc .ic{width:46px;height:46px}
footer{margin:28px -18px 0;background:var(--navy);color:#fff;padding:20px 18px calc(22px + env(safe-area-inset-bottom,0px));font-weight:600;border-radius:28px 28px 0 0}
a:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
</style>
</head>
